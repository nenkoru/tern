# blackbox_exporter modules used by prometheus.yml.
modules:
  # The data node's /info (relay serve --da).
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true

  # A public RPC: POST eth_chainId, the answer must be chain 83760 (0x14730).
  # For mainnet (8376) change the regexp to 0x20b8.
  rpc_chainid:
    prober: http
    timeout: 10s
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      fail_if_body_not_matches_regexp:
        - '"result"\s*:\s*"0x14730"'
