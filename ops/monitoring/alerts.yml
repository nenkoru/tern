# Alert rules for a ternchain L1. Severity: critical (SEV1/SEV2 in
# ops/incident/INCIDENT-RESPONSE.md) or warning (SEV3).
#
# Besu metric names (ethereum_blockchain_height, ethereum_peer_count) are
# Besu's standard ones. Check them once on your release:
#   curl -s 127.0.0.1:9545/metrics | grep -E '^ethereum_(blockchain_height|peer_count)'
# ternchain_* metrics come from seal-exporter.sh (cron, every minute).
groups:
  - name: chain
    rules:
      # No new block for 30 s on a node (the chain makes one a second).
      - alert: BlockProductionStalled
        expr: changes(ethereum_blockchain_height[30s]) == 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "No new block for 30 s on {{ $labels.node }}"
          description: >-
            Head stuck at {{ with query "max(ethereum_blockchain_height)" }}{{ . | first | value }}{{ end }}.
            If all nodes show it, the chain is halted (more than 1/3 of validators down?):
            playbook "Chain halt". If only this node: it lost its peers or is out of sync.

      # The same from the chain's point of view (seal exporter, every minute).
      - alert: ChainHeadOld
        expr: ternchain_head_age_seconds > 30
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "The head block is {{ $value }} s old"
          description: "ternchain validator status sees no new block. Playbook: Chain halt."

      - alert: SealExporterDown
        expr: >-
          ternchain_status_up == 0
          or absent(ternchain_status_up)
          or (time() - node_textfile_mtime_seconds{file=~".*ternchain_seals.prom"}) > 300
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "seal-exporter.sh is not reporting"
          description: "Check the cron job and its RPC (TERN_RPC). Without it there are no seal alerts."

      # QBFT round changes: a proposer missed its turn (down or slow).
      - alert: RoundChanges
        expr: ternchain_round_changes > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} round changes in the last 60 blocks"
          description: "A validator misses its proposer turns. See ValidatorNotProposing, and validator status 'recent'."

      - alert: RoundChangesMany
        expr: ternchain_round_changes >= 10
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} round changes in the last 60 blocks"
          description: "Blocks are slow (each missed turn waits requesttimeoutseconds, 4 s). Two or more validators may be down."

      # Quorum margin: blocks carry fewer seals than they should.
      - alert: SealsAtQuorumEdge
        expr: ternchain_min_seals < ternchain_validator_count - floor((ternchain_validator_count - 1) / 3)
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "A block had {{ $value }} seals: below the quorum of the set"
          description: "Check validator status; this should not happen on a healthy chain."

  - name: validators
    rules:
      # A validator in the set has not sealed for more than 2n blocks.
      # QBFT puts only a quorum of seals into each header, so a healthy
      # validator can miss a few blocks; 2n in a row means it is not sealing.
      - alert: ValidatorNotSealing
        expr: >-
          ternchain_validator_blocks_since_seal
            > on() group_left() (2 * ternchain_validator_count)
          and on(validator) ternchain_validator_in_set == 1
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Validator {{ $labels.citizen }} ({{ $labels.validator }}) is not sealing"
          description: >-
            No commit seal for {{ $value }} blocks. Contact the operator.
            If more than 1/3 of the set stops, the chain halts.

      # It sealed nothing at all in the window and proposed nothing.
      - alert: ValidatorNotProposing
        expr: >-
          ternchain_validator_proposed == 0
          and on(validator) ternchain_validator_in_set == 1
          and on() ternchain_blocks_looked_at >= 60
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Validator {{ $labels.citizen }} proposed no block in the last 60"
          description: "Each validator should propose about 60/n blocks. It is down, slow, or out of peers."

      - alert: ValidatorContractAlert
        expr: ternchain_contract_alerts > 0 and changes(ternchain_contract_alerts[1h]) > 0
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "New alert from the Validators contract"
          description: "Churn, a scheduled removal or a challenge. Read 'alerts' in ternchain validator status."

      - alert: UpgradeSoon
        expr: ternchain_upgrade_in_blocks > 0 and ternchain_upgrade_in_blocks < 7 * 86400
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Upgrade at block {{ $labels.at_block }} in {{ $value }} blocks (< 7 days)"
          description: "Every operator installs release {{ $labels.release }} before that block (ops/besu/UPGRADE.md)."

  - name: nodes
    rules:
      - alert: BesuDown
        expr: up{job=~"besu|besu-remote"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Besu metrics on {{ $labels.node }} ({{ $labels.role }}) do not answer"
          description: "The node is down, or its metrics proxy is."

      - alert: PeerCountLow
        expr: ethereum_peer_count < 3
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.node }} has {{ $value }} peers"
          description: "Check port 30303 TCP+UDP, the bootnodes, and --p2p-host (the public IP)."

      - alert: PeerCountZero
        expr: ethereum_peer_count == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.node }} has no peers"
          description: "It is cut off. A validator without peers cannot seal."

      - alert: DiskFilling
        expr: >-
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
             / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 0.80
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.node }} is over 80% full"
          description: "Plan more disk. Besu stops when the disk is full."

      - alert: DiskAlmostFull
        expr: >-
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
             / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 0.90
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.node }} is over 90% full"
          description: "Act now: free space or grow the disk. Old backups and docker images are the usual suspects."

  - name: services
    rules:
      - alert: DataNodeDown
        expr: probe_success{probe="datanode"} == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Data node {{ $labels.instance }} does not answer"
          description: "relay serve --da is down, or its proxy. Playbook: Data node down."

      - alert: DataNodeServerError
        expr: probe_http_status_code{probe="datanode"} >= 500
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Data node {{ $labels.instance }} answers {{ $value }}"
          description: "5xx from the data node or its proxy. Check journalctl for relay errors."

      - alert: PublicRPCDown
        expr: probe_success{probe="rpc"} == 0
        for: 3m
        labels: {severity: warning}
        annotations:
          summary: "Public RPC {{ $labels.instance }} fails eth_chainId (or wrong chain id)"
          description: "Clients fail over to the next RPC in net.json. Fix it before the other one fails too."

      - alert: AllPublicRPCsDown
        expr: sum(probe_success{probe="rpc"}) == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "No public RPC answers"
          description: "Clients cannot reach the chain. Fix one RPC first."

      - alert: TLSCertExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "TLS certificate of {{ $labels.instance }} expires in under 14 days"
          description: "Caddy renews by itself; if not, check port 80 and the Caddy log."
